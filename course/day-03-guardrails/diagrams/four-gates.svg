<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 470" width="896" height="470" role="img" aria-labelledby="fgTitle fgDesc">
  <title id="fgTitle">The four places a gate can physically sit</title>
  <desc id="fgDesc">Four gates, all of them code you own. The user's request passes through gate one, the input gate, before reaching the model. Fetched content passes through gate two, the retrieval gate, before reaching the model. When the model asks to run a tool, that request passes through gate three, the action gate, before your function touches the real system; this gate is highlighted because it is the only one standing between a decision and a consequence. The model's finished answer passes through gate four, the output gate, before it reaches the user. A note along the bottom states that any gate can fire a tripwire, which halts the run rather than asking the model again.</desc>
  <rect x="0" y="0" width="896" height="470" fill="#f5f5f5"/>
  <defs>
    <marker id="fgArw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
    <marker id="fgArwA" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
  </defs>

  <!-- sources -->
  <rect x="28" y="46" width="164" height="52" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="44" y="70" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">The user's request</text>
  <text x="44" y="88" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">"approve the March invoices"</text>

  <rect x="28" y="146" width="164" height="62" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="44" y="170" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Fetched content</text>
  <text x="44" y="188" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a PDF, an email, a search hit,</text>
  <text x="44" y="200" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">a record from the ERP</text>

  <!-- gates 1 and 2 -->
  <rect x="228" y="46" width="128" height="52" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="292" y="68" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">1 · Input gate</text>
  <text x="292" y="86" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">shape, size, topic</text>

  <rect x="228" y="146" width="128" height="62" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="292" y="168" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">2 · Retrieval gate</text>
  <text x="292" y="186" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">fence it, label it,</text>
  <text x="292" y="198" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">strip what shouldn't be there</text>

  <!-- model -->
  <rect x="392" y="76" width="132" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="458" y="122" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">Model</text>
  <text x="458" y="144" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">no gate lives in here</text>

  <!-- gate 3, the accent -->
  <rect x="560" y="76" width="130" height="66" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.4"/>
  <text x="625" y="100" fill="#eb6c36" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">3 · Action gate</text>
  <text x="625" y="118" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">which tool, which record,</text>
  <text x="625" y="130" fill="#eb6c36" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">whose approval, how many</text>

  <rect x="726" y="76" width="142" height="66" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="797" y="100" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">The real system</text>
  <text x="797" y="120" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">money moves here</text>

  <!-- gate 4 -->
  <rect x="392" y="252" width="132" height="62" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="458" y="276" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">4 · Output gate</text>
  <text x="458" y="294" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">secrets, personal data,</text>
  <text x="458" y="306" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">links that carry data out</text>

  <rect x="392" y="356" width="132" height="48" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="458" y="385" fill="#2d3142" font-size="11" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">The user</text>

  <!-- arrows -->
  <line x1="196" y1="72" x2="222" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fgArw)"/>
  <line x1="360" y1="72" x2="386" y2="72" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fgArw)"/>
  <line x1="196" y1="177" x2="222" y2="177" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fgArw)"/>
  <line x1="360" y1="177" x2="386" y2="177" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fgArw)"/>
  <line x1="528" y1="109" x2="554" y2="109" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#fgArwA)"/>
  <line x1="694" y1="109" x2="720" y2="109" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#fgArwA)"/>
  <line x1="458" y1="184" x2="458" y2="246" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fgArw)"/>
  <line x1="458" y1="318" x2="458" y2="350" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#fgArw)"/>

  <!-- footer -->
  <line x1="28" y1="424" x2="868" y2="424" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="28" y="444" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">ALL FOUR GATES ARE YOUR CODE</text>
  <text x="28" y="460" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Any gate can fire a tripwire: halt the run, record it, hand it to a person. A tripwire never asks the model to try again.</text>
</svg>
