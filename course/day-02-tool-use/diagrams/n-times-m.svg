<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 430" width="896" height="430" role="img" aria-labelledby="nxmTitle nxmDesc">
  <title id="nxmTitle">Why a connection standard exists: N times M versus N plus M</title>
  <desc id="nxmDesc">Two panels. On the left, three AI applications each wired separately to three business systems, giving nine bespoke integrations. On the right, the same six boxes each wired once to a single highlighted MCP layer in the middle, giving six connections. The count is what changes; the meaning of the data in each system does not.</desc>
  <rect x="0" y="0" width="896" height="430" fill="#f5f5f5"/>

  <!-- LEFT PANEL: no standard -->
  <text x="32" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">Without a standard</text>
  <line x1="92" y1="104" x2="92" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="92" y1="104" x2="212" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="92" y1="104" x2="332" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="212" y1="104" x2="92" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="212" y1="104" x2="212" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="212" y1="104" x2="332" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="332" y1="104" x2="92" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="332" y1="104" x2="212" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="332" y1="104" x2="332" y2="272" stroke="#4f5d75" stroke-width="1"/>

  <rect x="44" y="64" width="96" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="92" y="88" fill="#2d3142" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">agent A</text>
  <rect x="164" y="64" width="96" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="212" y="88" fill="#2d3142" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">agent B</text>
  <rect x="284" y="64" width="96" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="332" y="88" fill="#2d3142" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">agent C</text>

  <rect x="44" y="272" width="96" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="92" y="296" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">NetSuite</text>
  <rect x="164" y="272" width="96" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="212" y="296" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Salesforce</text>
  <rect x="284" y="272" width="96" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="332" y="296" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Postgres</text>

  <text x="212" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">9 bespoke integrations (3 × 3)</text>
  <text x="212" y="366" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">each one written, tested and maintained separately</text>

  <line x1="448" y1="32" x2="448" y2="380" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>

  <!-- RIGHT PANEL: one standard -->
  <text x="480" y="40" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">With one standard</text>
  <line x1="524" y1="104" x2="664" y2="164" stroke="#4f5d75" stroke-width="1"/>
  <line x1="644" y1="104" x2="664" y2="164" stroke="#4f5d75" stroke-width="1"/>
  <line x1="764" y1="104" x2="664" y2="164" stroke="#4f5d75" stroke-width="1"/>
  <line x1="664" y1="212" x2="524" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="664" y1="212" x2="644" y2="272" stroke="#4f5d75" stroke-width="1"/>
  <line x1="664" y1="212" x2="764" y2="272" stroke="#4f5d75" stroke-width="1"/>

  <rect x="476" y="64" width="96" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="524" y="88" fill="#2d3142" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">agent A</text>
  <rect x="596" y="64" width="96" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="644" y="88" fill="#2d3142" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">agent B</text>
  <rect x="716" y="64" width="96" height="40" rx="4" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="764" y="88" fill="#2d3142" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">agent C</text>

  <rect x="560" y="164" width="208" height="48" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="664" y="184" fill="#eb6c36" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">one protocol (MCP)</text>
  <text x="664" y="201" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">how to ask — not what the answer means</text>

  <rect x="476" y="272" width="96" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="524" y="296" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">NetSuite</text>
  <rect x="596" y="272" width="96" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="644" y="296" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Salesforce</text>
  <rect x="716" y="272" width="96" height="40" rx="4" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="764" y="296" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">Postgres</text>

  <text x="664" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">6 connections (3 + 3)</text>
  <text x="664" y="366" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">and the same three systems still disagree about everything</text>

  <line x1="60" y1="392" x2="836" y2="392" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="60" y="412" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="176" y="402" width="24" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="210" y="413" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the part a standard can fix</text>
</svg>
