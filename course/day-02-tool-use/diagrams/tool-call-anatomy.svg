<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 896 460" width="896" height="460" role="img" aria-labelledby="tcaTitle tcaDesc">
  <title id="tcaTitle">The anatomy of one tool call</title>
  <desc id="tcaDesc">A clockwise round trip. On the left, your tool definitions — a name, a description and an input specification — are sent up to the model with every request; the description is highlighted as the only thing the model ever learns about your system. The model returns a tool_use block naming one tool and its arguments. Your own function runs it against the real system. The result comes back as a tool_result, which returns to the model. The model is never connected to the system directly.</desc>
  <rect x="0" y="0" width="896" height="460" fill="#f5f5f5"/>
  <defs>
    <marker id="tcaArw" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>

  <!-- 1. your tool definitions -->
  <rect x="48" y="52" width="252" height="122" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="64" y="74" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">1 · Your tool definitions</text>
  <rect x="64" y="82" width="220" height="20" rx="3" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="74" y="96" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">name</text>
  <rect x="64" y="106" width="220" height="20" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="74" y="120" fill="#eb6c36" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">description  (prose the model reads)</text>
  <rect x="64" y="130" width="220" height="20" rx="3" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/>
  <text x="74" y="144" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">input specification</text>
  <text x="64" y="166" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">re-sent on every pass</text>

  <!-- 2. model -->
  <rect x="380" y="62" width="180" height="102" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.2"/>
  <text x="470" y="102" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" text-anchor="middle">2 · Model</text>
  <text x="470" y="122" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">picks one tool by</text>
  <text x="470" y="136" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="middle">reading the labels</text>

  <!-- 3. tool_use -->
  <rect x="628" y="62" width="220" height="102" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="644" y="86" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">3 · A request, not an act</text>
  <text x="644" y="108" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tool_use</text>
  <text x="644" y="124" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  name: get_invoice</text>
  <text x="644" y="140" fill="#4f5d75" font-size="9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">  input: {id: "INV-88"}</text>

  <!-- 4. your function -->
  <rect x="628" y="270" width="220" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="644" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">4 · Your function runs</text>
  <text x="644" y="316" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">your code, your credentials,</text>
  <text x="644" y="330" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">your consequences — it calls</text>
  <text x="644" y="344" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the accounting system</text>

  <!-- 5. tool_result -->
  <rect x="304" y="270" width="248" height="96" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1.2"/>
  <text x="320" y="294" fill="#2d3142" font-size="12" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">5 · tool_result</text>
  <text x="320" y="316" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the text the model actually sees.</text>
  <text x="320" y="330" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">its size and wording are part</text>
  <text x="320" y="344" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">of the tool you designed</text>

  <!-- arrows, clockwise -->
  <line x1="304" y1="113" x2="374" y2="113" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tcaArw)"/>
  <line x1="564" y1="113" x2="622" y2="113" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tcaArw)"/>
  <line x1="738" y1="168" x2="738" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tcaArw)"/>
  <line x1="624" y1="318" x2="558" y2="318" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tcaArw)"/>
  <line x1="428" y1="266" x2="428" y2="170" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#tcaArw)"/>

  <!-- the gap the model never crosses -->
  <line x1="60" y1="230" x2="836" y2="230" stroke="#7a8399" stroke-width="0.8" stroke-dasharray="4 4"/>
  <rect x="60" y="222" width="298" height="16" rx="2" fill="#f5f5f5"/>
  <text x="60" y="234" fill="#7a8399" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">ABOVE: THE MODEL'S SIDE   BELOW: YOUR CODE'S SIDE</text>

  <line x1="60" y1="400" x2="836" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="60" y="420" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="176" y="410" width="24" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <text x="210" y="421" fill="#4f5d75" font-size="8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">the whole interface: what you wrote about your own system</text>
</svg>
