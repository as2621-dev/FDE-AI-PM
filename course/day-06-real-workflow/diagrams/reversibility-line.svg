<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 430" width="980" height="430" role="img" aria-labelledby="rev-title rev-desc" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <title id="rev-title">One run of an invoice agent, with the approval pause on the reversibility boundary</title>
  <desc id="rev-desc">A single run reads left to right through four steps the agent performs alone: parse the document, look up the matching purchase order, cross-check the contract terms, and draft the record without writing it anywhere. A vertical dashed line marks the reversibility boundary. The approval pause straddles that line: the run stops and waits for a person. Only after the decision does the run continue to the one step that cannot be taken back: posting the record to the ERP. A note underneath states that every box is one span in the trace and that the pause is a stopping condition, not a failed check.</desc>

  <rect x="0" y="0" width="980" height="430" fill="#f5f5f5"/>

  <text x="32" y="38" font-size="15" font-weight="600" fill="#2d3142">Where the pause goes</text>
  <text x="32" y="58" font-size="11.5" fill="#4f5d75">One run. The boundary is not &#8220;risky vs safe&#8221; &#8212; it is whether you can put the customer&#8217;s systems back.</text>

  <!-- band labels -->
  <text x="32" y="92" font-size="9.5" font-weight="600" fill="#7a8399" letter-spacing="0.8">THE AGENT ACTS ALONE &#8212; NOTHING IS WRITTEN</text>
  <text x="700" y="92" font-size="9.5" font-weight="600" fill="#7a8399" letter-spacing="0.8">CANNOT BE TAKEN BACK</text>

  <!-- reversibility line -->
  <line x1="628" y1="76" x2="628" y2="330" stroke="#eb6c36" stroke-width="1.6" stroke-dasharray="5 4"/>
  <text x="628" y="350" font-size="10" font-weight="600" fill="#eb6c36" text-anchor="middle">the reversibility boundary</text>

  <!-- left-side boxes -->
  <rect x="32" y="112" width="134" height="66" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="44" y="132" font-size="9.5" fill="#7a8399">READ</text>
  <text x="44" y="150" font-size="11" fill="#2d3142">parse the</text>
  <text x="44" y="165" font-size="11" fill="#2d3142">document</text>

  <rect x="182" y="112" width="134" height="66" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="194" y="132" font-size="9.5" fill="#7a8399">READ</text>
  <text x="194" y="150" font-size="11" fill="#2d3142">pull the matching</text>
  <text x="194" y="165" font-size="11" fill="#2d3142">purchase order</text>

  <rect x="332" y="112" width="134" height="66" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="344" y="132" font-size="9.5" fill="#7a8399">READ</text>
  <text x="344" y="150" font-size="11" fill="#2d3142">cross-check the</text>
  <text x="344" y="165" font-size="11" fill="#2d3142">contract terms</text>

  <rect x="482" y="112" width="134" height="66" rx="3" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <text x="494" y="132" font-size="9.5" fill="#7a8399">DRAFT</text>
  <text x="494" y="150" font-size="11" fill="#2d3142">assemble the</text>
  <text x="494" y="165" font-size="11" fill="#2d3142">record, unposted</text>

  <!-- pause node straddling the line -->
  <rect x="546" y="212" width="164" height="80" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.8"/>
  <text x="558" y="234" font-size="9.5" font-weight="600" fill="#eb6c36">PAUSE</text>
  <text x="558" y="253" font-size="11" font-weight="600" fill="#2d3142">a person decides</text>
  <text x="558" y="271" font-size="10" fill="#4f5d75">approve &#183; edit &#183;</text>
  <text x="558" y="285" font-size="10" fill="#4f5d75">reject</text>

  <!-- right-side boxes -->
  <rect x="740" y="112" width="134" height="66" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1.4"/>
  <text x="752" y="132" font-size="9.5" fill="#7a8399">WRITE</text>
  <text x="752" y="150" font-size="11" fill="#2d3142">post to the ERP</text>
  <text x="752" y="165" font-size="11" fill="#2d3142">&#8212; no re-keying</text>

  <!-- flow arrows -->
  <path d="M 168 145 L 178 145" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#rev-arrow)"/>
  <path d="M 318 145 L 328 145" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#rev-arrow)"/>
  <path d="M 468 145 L 478 145" stroke="#4f5d75" stroke-width="1" fill="none" marker-end="url(#rev-arrow)"/>
  <path d="M 596 180 L 596 208" stroke="#eb6c36" stroke-width="1.4" fill="none" marker-end="url(#rev-arrow-a)"/>
  <path d="M 710 232 L 724 232 L 724 145 L 736 145" stroke="#2d3142" stroke-width="1.2" fill="none" marker-end="url(#rev-arrow-i)"/>

  <defs>
    <marker id="rev-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5d75"/>
    </marker>
    <marker id="rev-arrow-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#eb6c36"/>
    </marker>
    <marker id="rev-arrow-i" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3142"/>
    </marker>
  </defs>

  <!-- notes -->
  <line x1="32" y1="372" x2="948" y2="372" stroke="#7a8399" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="32" y="392" font-size="10.5" fill="#4f5d75">Every box is one span in the trace. The pause is a stopping condition the run resumes from &#8212; not a failed check that ends it.</text>
  <text x="32" y="410" font-size="10.5" fill="#4f5d75">One write sits past the boundary, so the floor for this run is one pause. Two writes would share it only if one screen could honestly represent both.</text>
</svg>
